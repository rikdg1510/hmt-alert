name: HMT stock alert
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test notification"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: hmt-alert
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Test notification
        if: ${{ inputs.test }}
        run: python monitor.py --test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Check stock
        if: ${{ !inputs.test }}
        run: python monitor.py
        env:
          HMT_PAGES: mens
          NOTIFY_NEW: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          HMT_WATCH: ${{ vars.HMT_WATCH }}
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "hmt-bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git add health.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -X theirs && git push)
